services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: perfil_medico
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Dentro de la red de Docker, la base de datos se llama "db" (no localhost)
      DATABASE_URL: postgresql://postgres:postgres@db:5432/perfil_medico
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Al levantar el contenedor: aplica las migraciones y luego corre la API.
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./app:/code/app  # recarga en vivo durante desarrollo

volumes:
  db_data:
