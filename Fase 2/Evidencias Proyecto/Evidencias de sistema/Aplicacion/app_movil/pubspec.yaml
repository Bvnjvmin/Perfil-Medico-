name: app_movil
description: "App móvil de Perfil Médico+ (Flutter) — Sprint 5: Indicadores de salud e historial de cumplimiento, módulo de IA, pulsera inteligente (Traccar + Health Connect) y botón de asistencia"
publish_to: 'none'
version: 0.2.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  flutter_secure_storage: ^9.2.2
  # Guarda localmente qué actividades de la agenda se confirmaron cada día
  # (el backend aún no tiene tabla ACTIVIDAD: queda para el Sprint 3).
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
